<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>First Aid Guide</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Instrument+Sans:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div class="header-badge">
      <div class="pulse"></div>
      Emergency Reference
    </div>
    <h1>First Aid<br /><em>Quick Guide</em></h1>
    <p class="header-sub">
      Simple, clear first aid steps for common injuries and emergencies. Search
      or browse by category below.
    </p>
  </header>

  <section class="search-wrap">
    <div class="search-icon">&#128269;</div>
    <input
      type="text"
      id="searchInput"
      placeholder="Search injuries, e.g. burn, choking, nosebleed..."
    />
  </section>

  <section class="filters-wrap" id="filters">
    <button class="cat-btn active" onclick="filterCat('all', this)">All</button>
    <button class="cat-btn" onclick="filterCat('wounds', this)">
      &#129657; Wounds
    </button>
    <button class="cat-btn" onclick="filterCat('burns', this)">
      &#128293; Burns
    </button>
    <button class="cat-btn" onclick="filterCat('breathing', this)">
      &#129729; Breathing
    </button>
    <button class="cat-btn" onclick="filterCat('bone', this)">
      &#129460; Bone &amp; Muscle
    </button>
    <button class="cat-btn" onclick="filterCat('head', this)">
      &#129504; Head
    </button>
    <button class="cat-btn" onclick="filterCat('other', this)">
      &#9889; Other
    </button>
  </section>

  <main class="main">
    <div class="grid" id="grid"></div>
  </main>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" id="modal">
      <div class="modal-top">
        <div class="modal-icon" id="mIcon"></div>
        <div>
          <div class="modal-title" id="mTitle"></div>
          <div id="mUrgency"></div>
        </div>
        <button class="modal-close" onclick="closeModalDirect()">
          &#10006;
        </button>
      </div>
      <div class="modal-body">
        <div class="warning-box" id="mWarning"></div>
        <div class="call-box" id="mCall"></div>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
