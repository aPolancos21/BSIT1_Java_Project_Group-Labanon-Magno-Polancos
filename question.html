<!-- question.html -->
<!DOCTYPE html>
<html>
<head>
    <title>Questioning Queue</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
            padding-top: 80px;
        }

        .box {
            background: #1e293b;
            width: 350px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            margin-bottom: 20px;
        }

        #questionNumber {
            font-size: 100px;
            color: #3b82f6;
            margin: 20px 0;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            margin: 10px;
        }

        .next-btn {
            background: #3b82f6;
        }

        .back-btn {
            background: #ef4444;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Questioning Queue</h1>

        <div id="questionNumber">1</div>

        <button class="next-btn" onclick="nextQuestion()">
            Next Student
        </button>

        <button class="back-btn" onclick="history.back()">
            Return
        </button>
    </div>

    <script>
        let question = Number(localStorage.getItem("questionQueue")) || 1;

        document.getElementById("questionNumber").innerText = question;

        Notification.requestPermission();

        function nextQuestion() {
            question++;
            document.getElementById("questionNumber").innerText = question;

            localStorage.setItem("questionQueue", question);

            if (Notification.permission === "granted") {
                new Notification("Questioning Queue", {
                    body: "Now serving number " + question
                });
            }
        }

        window.addEventListener("storage", function(event) {
            if (event.key === "questionQueue") {
                document.getElementById("questionNumber").innerText = event.newValue;
            }
        });
    </script>

</body>
</html>
